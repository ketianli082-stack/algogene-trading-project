name: BTC V1.1 - ALGOGENE ADX 20 25 30 Training
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-v1-1-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-v1-1-cloud
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test strategy, no API
        run: |
          python -m py_compile strategy/btc_v1_1_ema_adx60.py tools/btc_v1_1_cloud_run.py
          python -m unittest discover -s tests -p 'test_btc_v1_1.py' -v
      - name: Sequential cloud backtest for training period only
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/btc_v1_1_cloud_run.py
      - name: Upload credential-redacted evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v1-1-adx-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/btc_v1_1/evidence.json
          if-no-files-found: warn
          retention-days: 90
