name: BTC V1.1-C - ADX30 ALGOGENE Cloud Backtest
on:
  workflow_run:
    workflows:
      - BTC V1.1-B - ADX25 ALGOGENE Cloud Backtest
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-algogene-cloud-exclusive
  cancel-in-progress: false
jobs:
  adx30:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile code and run offline tests
        run: |
          python -m py_compile strategy/btc_v1_1_ema_adx60.py tools/btc_v1_1_c_cloud_run.py
          python -m unittest discover -s tests -p 'test_btc_v1_1.py' -v
      - name: Submit only ADX30 native ALGOGENE cloud backtest
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/btc_v1_1_c_cloud_run.py
      - name: Retain redacted platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v1-1-c-adx30-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/btc_v1_1_c/evidence.json
          if-no-files-found: warn
          retention-days: 90
