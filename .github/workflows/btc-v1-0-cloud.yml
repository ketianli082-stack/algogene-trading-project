name: BTC V1.0 - ALGOGENE Cloud Backtest 2021-2024
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-v1-0-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-v1-0-algogene-cloud
  cancel-in-progress: false
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static checks for BTC V1.0
        run: |
          python -m py_compile strategy/btc_v1_0_ema60.py tools/btc_v1_0_cloud_run.py
          python -m unittest discover -s tests -p 'test_btc_v1_0.py' -v
      - name: Submit one guarded ALGOGENE backtest and collect evidence
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u tools/btc_v1_0_cloud_run.py
      - name: Upload redacted backtest evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v1-0-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/btc_v1_0/platform-evidence.json
          if-no-files-found: warn
          retention-days: 90
