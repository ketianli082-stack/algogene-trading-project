name: ALGOGENE EXP014 H1-only strategy quality
on:
  push:
    branches: [codex/algogene-crypto-v1.0]
    paths: [configs/exp014_h1_quality.json]
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test all safety guards without cloud calls
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
      - name: Submit four registered H1-only Development backtests sequentially
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/algogene_combination_batch_exp014.py
      - name: Upload original and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp014-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/exp014/
          retention-days: 90
      - name: Archive immutable final bundle or partial failure
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/archive_v1_4_results.py --experiment EXP-014 --source outputs/exp014/platform-responses.json
