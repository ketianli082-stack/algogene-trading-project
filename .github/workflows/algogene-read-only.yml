name: ALGOGENE read-only history check

on:
  workflow_dispatch:
    inputs:
      timestamp:
        description: "History endpoint cutoff (YYYY-MM-DD)"
        required: true
        default: "2026-11-03"

permissions:
  contents: read

concurrency:
  group: algogene-read-only-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Query three BTCUSD hourly bars (read-only)
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          ALGOGENE_HISTORY_TIMESTAMP: ${{ inputs.timestamp }}
        run: python scripts/algogene_history_smoke.py
