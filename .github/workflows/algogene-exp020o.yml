name: ALGOGENE EXP020O strict no-TradeCost-field platform test 2025
on:
  push:
    branches: [research/four-asset-basis-2023-2025]
    paths: [configs/exp020o_omit_tradecost.json]
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and independently test code before API requests
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
      - name: Submit original EXP020 strategy with TradeCost key ABSENT and verify native 0.0
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/algogene_exp020o_run.py
      - name: Upload platform and shadow-fee evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp020o-2025-percent-fees-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/exp020o/platform-responses.json
          retention-days: 90
      - name: Archive native fee evidence, reject nonzero native costs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test -f outputs/exp020o/platform-responses.json; then
            python scripts/archive_exp020o.py
          fi
