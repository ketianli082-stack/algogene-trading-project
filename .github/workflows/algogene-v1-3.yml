name: ALGOGENE V1.3 automatic Development experiment
on:
  push:
    branches: [codex/algogene-crypto-v1.0]
    paths: [configs/v1_3_cloud.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Submit once, wait, and collect original platform responses
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python -u scripts/algogene_v1_3_pipeline.py
      - name: Preserve evidence artifact, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-3-platform-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/v1_3/platform-responses.json
          retention-days: 90
      - name: Save evidence to experiment branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/archive_v1_3_results.py
