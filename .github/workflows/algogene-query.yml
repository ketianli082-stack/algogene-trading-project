name: Query existing ALGOGENE V1.0 backtest
on:
  push:
    branches: [codex/algogene-crypto-v1.0]
    paths: [scripts/algogene_query_backtest.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read logs and performance of existing backtest
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
        run: python scripts/algogene_query_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: algogene-query-evidence
          path: outputs/cloud-query.json
