name: ALGOGENE EXP021 2021-2025 annual entry funnel diagnostic
on:
  push:
    branches: [research/four-asset-basis-2023-2025]
    paths: [configs/exp021_diagnostic.json]
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate strategy and diagnostic guards
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
      - name: One diagnostic backtest only (2021-2025)
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/algogene_exp021_diagnostic_run.py
      - name: Upload raw redacted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp021-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/exp021_diagnostic/platform-responses.json
          retention-days: 90
      - name: Immutable GitHub evidence checkpoint
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test -f outputs/exp021_diagnostic/platform-responses.json; then
            python scripts/archive_exp021_diagnostic.py
          fi
