name: ALGOGENE EXP019 EXP018 unchanged 2025 and 2021-25 windows
on:
  push:
    branches: [research/four-asset-basis-2023-2025]
    paths: [configs/exp019_same_strategy_windows.json]
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test source offline, zero API requests
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
      - name: Two strictly serial native ALGOGENE EXP018 unchanged-window backtests
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/algogene_exp019_windows_run.py
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp019-window-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/exp019/platform-responses.json
          retention-days: 90
      - name: Archive immutable native response or failure
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test -f outputs/exp019/platform-responses.json; then
            python scripts/archive_exp019.py
          fi
