name: ALGOGENE EXP015 native score H1-only research
on:
  push:
    branches: [codex/algogene-crypto-v1.0]
    paths: [configs/exp015_h1_score.json]
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run all offline unit guards
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
      - name: Sequential native ALGOGENE H1 backtests for score research
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/algogene_combination_batch_exp015.py
      - name: Preserve complete or partial backtest and leaderboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp015-native-score-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/exp015/
          retention-days: 90
      - name: Archive immutable final native response or partial failure
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/archive_v1_4_results.py --experiment EXP-015 --source outputs/exp015/platform-responses.json
