name: ALGOGENE EXP013 H1 cost gate vs H4
on:
  push:
    branches: [codex/algogene-crypto-v1.0]
    paths: [configs/exp013_cost_h4.json]
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test all strategy guards offline
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
      - name: Sequential Development cloud backtests
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/algogene_combination_batch_exp013.py
      - name: Upload complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp013-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/exp013/
          retention-days: 90
      - name: Archive immutable final or failure response
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/archive_v1_4_results.py --experiment EXP-013 --source outputs/exp013/platform-responses.json
