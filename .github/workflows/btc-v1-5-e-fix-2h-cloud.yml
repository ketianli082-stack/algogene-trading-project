name: BTC V1.5 E-Fix-2h - Reentry Cooldown
on:
  workflow_run:
    workflows: ['BTC V1.5 E-Fix-4h - Reentry Cooldown']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: btc-algogene-cloud-exclusive
  cancel-in-progress: false
jobs:
  predecessor-success:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful 4h predecessor
        env:
          PREDECESSOR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: test "$PREDECESSOR_CONCLUSION" = 'success'
  backtest:
    needs: predecessor-success
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile code and run offline tests
        run: |
          python -m py_compile strategy/btc_v1_5_e_reentry_diagnostic60.py tools/btc_v1_5_e_fix_cloud_run.py
          python -m unittest discover -s tests -p 'test_btc_v1_5_e.py' -v
          python -m unittest discover -s tests -p 'test_btc_v1_5_e_fix.py' -v
      - name: Submit native ALGOGENE E-Fix 2h backtest
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          E_FIX_COOLDOWN_HOURS: '2'
        run: python -u tools/btc_v1_5_e_fix_cloud_run.py
      - name: Retain complete redacted platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v1-5-e-fix-2h-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/btc_v1_5_e_fix_2h/evidence.json
          if-no-files-found: warn
          retention-days: 90
