name: ALGOGENE EXP020 percent-fee-aware H1 strategy 2025 validation
on:
  push:
    branches: [research/four-asset-basis-2023-2025]
    paths: [configs/exp020_percent_fee.json]
permissions:
  contents: write
concurrency:
  group: algogene-cloud-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and independently test code before API requests
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
      - name: One guarded ALGOGENE backtest with actual 0.05 percent shadow fee
        env:
          ALGOGENE_USER_ID: ${{ secrets.ALGOGENE_USER_ID }}
          ALGOGENE_API_KEY: ${{ secrets.ALGOGENE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/algogene_exp020_run.py
      - name: Upload platform and shadow-fee evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp020-2025-percent-fees-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/exp020/platform-responses.json
          retention-days: 90
      - name: Archive immutable native and adjusted results
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test -f outputs/exp020/platform-responses.json; then
            python scripts/archive_exp020.py
          fi
